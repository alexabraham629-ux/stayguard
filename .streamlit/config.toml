# StayGuard theme: one accent (blue), quiet neutrals, system sans. Not any real brand's colours.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
headless = true
